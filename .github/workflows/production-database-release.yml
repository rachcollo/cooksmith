name: Production database release

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Paste the full 40-character commit SHA currently at the tip of main
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION_DATABASE to confirm
        required: true
        type: string
      allow_out_of_order_migrations:
        description: >-
          Only for a known, reviewed exception (e.g. a migration merged after a
          newer one already reached production). Skips Supabase's check that
          pending migrations are newer than the latest released migration.
          Leave unchecked for normal releases.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cooksmith-production-database
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      INCLUDE_ALL_FLAG: ${{ inputs.allow_out_of_order_migrations == true && '--include-all' || '' }}

    steps:
      - name: Check release approval inputs
        env:
          APPROVED_COMMIT: ${{ inputs.release_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ ! "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_commit must be an actual 40-character lowercase Git commit SHA, not the example text."
            exit 1
          fi
          if [ "$APPROVED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::release_commit must match the current main commit: $GITHUB_SHA"
            exit 1
          fi
          if [ "$CONFIRMATION" != "DEPLOY_PRODUCTION_DATABASE" ]; then
            echo "::error::confirmation must be DEPLOY_PRODUCTION_DATABASE"
            exit 1
          fi

      - name: Check required protected secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Warn if migration ordering check is disabled
        if: inputs.allow_out_of_order_migrations == true
        run: echo "::warning::allow_out_of_order_migrations is enabled — Supabase's pending-migration ordering check is bypassed for this run (--include-all)."

      - name: Check out approved main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Check database migration configuration
        run: npm run db:config:check

      - name: Link approved Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show remote migration state
        run: npx supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Dry-run pending migrations
        run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" $INCLUDE_ALL_FLAG --dry-run

      - name: Apply pending migrations
        run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" $INCLUDE_ALL_FLAG --yes

      - name: Verify migration history is current
        run: |
          npx supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" $INCLUDE_ALL_FLAG --dry-run
