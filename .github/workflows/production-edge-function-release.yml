name: Production Edge Function release

on:
  push:
    branches:
      - main
    paths:
      - supabase/functions/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cooksmith-production-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved Edge Function
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check approved release identity
        env:
          APPROVED_COMMIT: ${{ github.sha }}
        run: |
          if [[ ! "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The approved release must resolve to a full 40-character lowercase Git commit SHA."
            exit 1
          fi
          if [ "$APPROVED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::The approved release identity must match the workflow commit: $GITHUB_SHA"
            exit 1
          fi

      - name: Check required protected secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Check out approved main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Check Edge Function source
        run: |
          test -f supabase/functions/import-recipe/index.ts
          test -f supabase/functions/import-recipe/extractor.ts
          test -f supabase/functions/import-recipe/urlSafety.ts
          test -f supabase/functions/enrich-recipe/index.ts
          test -f supabase/functions/enrich-recipe/openaiAdapter.ts
          test -f supabase/functions/generate-weekly-preparation-plan/index.ts
          test -f supabase/functions/generate-weekly-preparation-plan/openaiAdapter.ts
          test -f supabase/functions/get-weekly-preparation-plan/index.ts
          test -f supabase/functions/evaluate-weekly-preparation/index.ts

      - name: Deploy authenticated import-recipe function
        run: npx supabase functions deploy import-recipe --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Deploy protected enrich-recipe worker
        run: npx supabase functions deploy enrich-recipe --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Deploy protected weekly preparation worker
        run: npx supabase functions deploy generate-weekly-preparation-plan --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

      - name: Deploy authenticated weekly preparation endpoint
        run: npx supabase functions deploy get-weekly-preparation-plan --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Deploy authenticated weekly preparation evaluation
        run: npx supabase functions deploy evaluate-weekly-preparation --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Verify deployed function
        run: |
          npx supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > /tmp/functions.json
          node -e "const fs=require('node:fs'); const functions=JSON.parse(fs.readFileSync('/tmp/functions.json','utf8')); if (!functions.some((entry) => entry.name === 'import-recipe' && entry.verify_jwt !== false)) process.exit(1); if (!functions.some((entry) => entry.name === 'enrich-recipe' && entry.verify_jwt === false)) process.exit(1); if (!functions.some((entry) => entry.name === 'generate-weekly-preparation-plan' && entry.verify_jwt === false)) process.exit(1); if (!functions.some((entry) => entry.name === 'get-weekly-preparation-plan' && entry.verify_jwt !== false)) process.exit(1); if (!functions.some((entry) => entry.name === 'evaluate-weekly-preparation' && entry.verify_jwt !== false)) process.exit(1)"

      - name: Bind hosted evaluation evidence to the deployed commit
        env:
          COOKSMITH_DEPLOYMENT_SHA: ${{ github.sha }}
        run: npx supabase secrets set COOKSMITH_DEPLOYMENT_SHA="$COOKSMITH_DEPLOYMENT_SHA" --project-ref "$SUPABASE_PROJECT_REF"
