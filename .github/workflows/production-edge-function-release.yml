name: Production Edge Function release

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Paste the full 40-character commit SHA currently at the tip of main
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION_EDGE_FUNCTION to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cooksmith-production-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved Edge Function
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check release approval inputs
        env:
          APPROVED_COMMIT: ${{ inputs.release_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ ! "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_commit must be an actual 40-character lowercase Git commit SHA, not the example text."
            exit 1
          fi
          if [ "$APPROVED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::release_commit must match the current main commit: $GITHUB_SHA"
            exit 1
          fi
          if [ "$CONFIRMATION" != "DEPLOY_PRODUCTION_EDGE_FUNCTION" ]; then
            echo "::error::confirmation must be DEPLOY_PRODUCTION_EDGE_FUNCTION"
            exit 1
          fi

      - name: Check required protected secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Check out approved main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Check Edge Function source
        run: |
          test -f supabase/functions/import-recipe/index.ts
          test -f supabase/functions/import-recipe/extractor.ts
          test -f supabase/functions/import-recipe/urlSafety.ts

      - name: Deploy authenticated import-recipe function
        run: npx supabase functions deploy import-recipe --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Verify deployed function
        run: |
          npx supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > /tmp/functions.json
          node -e "const fs=require('node:fs'); const functions=JSON.parse(fs.readFileSync('/tmp/functions.json','utf8')); if (!functions.some((entry) => entry.name === 'import-recipe' && entry.verify_jwt !== false)) process.exit(1)"
