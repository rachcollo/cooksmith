name: PR governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cooksmith-pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: Validate Jira and engineering-package linkage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate PR governance
        run: npm run engineering:validate-pr
