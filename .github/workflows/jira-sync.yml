name: Jira sync

# Best-effort Jira evidence and status sync. Never required to pass and never
# blocks a merge: Jira availability is not a build-validity signal. Requires
# JIRA_BASE_URL, JIRA_EMAIL and JIRA_API_TOKEN repository secrets; the sync
# script skips cleanly when they are absent.

on:
  create:
  pull_request:
    types: [opened, ready_for_review, closed]
    branches: [main]
  workflow_run:
    workflows: [Cooksmith quality]
    types: [completed]

permissions:
  contents: read

jobs:
  branch-created:
    name: Branch created
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Sync branch creation to Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          BRANCH="${{ github.event.ref }}"
          KEY=$(echo "$BRANCH" | grep -ioE 'cs-[0-9]+' | head -n1 | tr '[:lower:]' '[:upper:]')
          if [ -z "$KEY" ]; then
            echo "No Jira key found in branch name '$BRANCH'; skipping."
            exit 0
          fi
          case "$BRANCH" in
            package/*)
              echo "Engineering-package branch '$BRANCH'; not an implementation start, skipping status sync."
              exit 0
              ;;
          esac
          node scripts/engineering/jira-sync.mjs branch-created \
            --key "$KEY" \
            --branch "$BRANCH" \
            --actor "${{ github.actor }}" \
            --sha "${{ github.sha }}"

  pr-opened:
    name: Pull request opened
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Sync PR opened to Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          KEY=$(echo "$TITLE" | grep -ioE 'cs-[0-9]+' | head -n1 | tr '[:lower:]' '[:upper:]')
          if [ -z "$KEY" ]; then
            echo "No Jira key found in PR title '$TITLE'; skipping."
            exit 0
          fi
          if printf '%s' "$TITLE" | grep -qiE '^(chore|infra)(\([^)]*\))?:'; then
            echo "Infrastructure or package PR '$TITLE'; not a build in review, skipping status sync."
            exit 0
          fi
          node scripts/engineering/jira-sync.mjs pr-opened \
            --key "$KEY" \
            --pr-url "${{ github.event.pull_request.html_url }}"

  pr-merged:
    name: Pull request merged
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Sync PR merge evidence to Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          KEY=$(echo "$TITLE" | grep -ioE 'cs-[0-9]+' | head -n1 | tr '[:lower:]' '[:upper:]')
          if [ -z "$KEY" ]; then
            echo "No Jira key found in PR title '$TITLE'; skipping."
            exit 0
          fi
          if printf '%s' "$TITLE" | grep -qiE '^chore\(package\):'; then
            node scripts/engineering/jira-sync.mjs package-merged \
              --key "$KEY" \
              --pr-url "${{ github.event.pull_request.html_url }}"
            exit 0
          fi
          # Detect what this merge actually changed so the Jira comment states
          # exactly which production releases are required, rather than a
          # generic reminder. Fall back to "no" if the diff cannot be computed.
          FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null || true)
          DB_REQUIRED=no
          EDGE_REQUIRED=no
          if printf '%s\n' "$FILES" | grep -qE '^supabase/migrations/.*\.sql$'; then
            DB_REQUIRED=yes
          fi
          if printf '%s\n' "$FILES" | grep -qE '^supabase/functions/'; then
            EDGE_REQUIRED=yes
          fi
          node scripts/engineering/jira-sync.mjs pr-merged \
            --key "$KEY" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --merge-commit "${{ github.event.pull_request.merge_commit_sha }}" \
            --db-required "$DB_REQUIRED" \
            --edge-required "$EDGE_REQUIRED"

  ci-failure:
    name: Required checks failed
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Sync CI failure to Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          TITLE="${{ github.event.workflow_run.display_title }}"
          KEY=$(echo "$TITLE" | grep -ioE 'cs-[0-9]+' | head -n1 | tr '[:lower:]' '[:upper:]')
          if [ -z "$KEY" ]; then
            echo "No Jira key found in workflow run title '$TITLE'; skipping."
            exit 0
          fi
          node scripts/engineering/jira-sync.mjs ci-failure \
            --key "$KEY" \
            --workflow-name "${{ github.event.workflow_run.name }}" \
            --run-url "${{ github.event.workflow_run.html_url }}"
